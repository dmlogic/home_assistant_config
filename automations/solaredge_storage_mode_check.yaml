alias: SolarEdge storage mode check
description: >-
  Warn when the SolarEdge storage control mode is not Maximize Self Consumption, for
  example after an accidental change in the SolarEdge app. The battery rules assume it.
triggers:
  - trigger: state
    entity_id: select.solaredge_multi_i1_storage_control_mode
    for: "00:05:00"
  - trigger: homeassistant
    event: start
conditions:
  - condition: template
    value_template: >
      {{ has_value('select.solaredge_multi_i1_storage_control_mode')
         and not is_state('select.solaredge_multi_i1_storage_control_mode', 'Maximize Self Consumption') }}
actions:
  - service: persistent_notification.create
    data:
      notification_id: solaredge_storage_mode
      title: SolarEdge storage mode changed
      message: >-
        Storage control mode is {{ states('select.solaredge_multi_i1_storage_control_mode') }}.
        The battery and EV rules expect Maximize Self Consumption.
  - service: logbook.log
    data:
      name: SolarEdge storage mode
      message: "is {{ states('select.solaredge_multi_i1_storage_control_mode') }}, expected Maximize Self Consumption"
mode: single
