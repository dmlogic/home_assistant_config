alias: SolarEdge storage mode check
description: >-
  Warn when the SolarEdge storage control mode is not Remote Control, for example
  after an accidental change in the SolarEdge app. The battery mode controller needs
  it; without it the battery runs as plain Maximize Self Consumption and only the
  backup reserve protects it from the car.
triggers:
  - trigger: state
    entity_id: select.solaredge_multi_i1_storage_control_mode
    for: "00:05:00"
  - trigger: homeassistant
    event: start
conditions:
  - condition: template
    value_template: >
      {{ has_value('select.solaredge_multi_i1_storage_control_mode')
         and not is_state('select.solaredge_multi_i1_storage_control_mode', 'Remote Control') }}
actions:
  - service: persistent_notification.create
    data:
      notification_id: solaredge_storage_mode
      title: SolarEdge storage mode changed
      message: >-
        Storage control mode is {{ states('select.solaredge_multi_i1_storage_control_mode') }}.
        The battery rules expect Remote Control (default mode Maximize Self Consumption).
  - service: logbook.log
    data:
      name: SolarEdge storage mode
      message: "is {{ states('select.solaredge_multi_i1_storage_control_mode') }}, expected Remote Control"
mode: single
