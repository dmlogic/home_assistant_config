alias: Immersion solar control
description: >-
  Run the immersion heater on surplus solar that would otherwise be exported. The car
  charging at home takes priority. Sends a command only when the heater must change.
triggers:
  - trigger: state
    entity_id:
      - binary_sensor.surplus_power
      - input_boolean.doors_armed
      - sensor.tesla_model_3_charging
      - device_tracker.tesla_model_3_location
      - switch.immersion_plus1m_switch_0
  - trigger: time_pattern
    minutes: /5
  - trigger: homeassistant
    event: start
actions:
  - variables:
      wanted: >
        {{ is_state('input_boolean.doors_armed', 'off')
           and is_state('binary_sensor.surplus_power', 'on')
           and not (is_state('sensor.tesla_model_3_charging', 'charging')
                    and is_state('device_tracker.tesla_model_3_location', 'home')) }}
  - choose:
      - conditions: "{{ wanted and is_state('switch.immersion_plus1m_switch_0', 'off') }}"
        sequence:
          - service: switch.turn_on
            target:
              entity_id: switch.immersion_plus1m_switch_0
      - conditions: "{{ not wanted and is_state('switch.immersion_plus1m_switch_0', 'on') }}"
        sequence:
          - service: switch.turn_off
            target:
              entity_id: switch.immersion_plus1m_switch_0
mode: queued
max: 3
