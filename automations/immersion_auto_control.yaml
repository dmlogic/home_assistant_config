alias: Immersion solar control
description: >-
  Turn the immersion heater on or off depending on the amount of surplus energy
  available
trigger:
  - platform: time_pattern
    minutes: /2
  - platform: state
    entity_id:
      - sensor.tesla_model_3_charging
      - device_tracker.tesla_model_3_location
condition: []
action:
  - if:
      - condition: state
        entity_id: input_boolean.doors_armed
        state: "off"
      - condition: state
        state: "on"
        entity_id: binary_sensor.surplus_power
      - condition: not
        conditions:
          - condition: and
            conditions:
              - condition: state
                entity_id: sensor.tesla_model_3_charging
                state: charging
              - condition: state
                entity_id: device_tracker.tesla_model_3_location
                state: home
    then:
      - type: turn_on
        device_id: 27039aa29995acc00f5acaa3483ce65b
        entity_id: 129d7d397fa8ec0a010a7086e6935ffe
        domain: switch
    else:
      - type: turn_off
        device_id: 27039aa29995acc00f5acaa3483ce65b
        entity_id: 129d7d397fa8ec0a010a7086e6935ffe
        domain: switch
mode: restart
