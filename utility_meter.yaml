grid_import_daily:
  source: sensor.solaredge_m1_imported_kwh
  cycle: daily
grid_export_daily:
  source: sensor.solaredge_m1_exported_kwh
  cycle: daily
solar_generation_daily:
  source: sensor.energy_solar_generation
  cycle: daily
battery_charged_daily:
  source: sensor.energy_battery_charged
  cycle: daily
battery_discharged_daily:
  source: sensor.energy_battery_discharged
  cycle: daily
ev_solar_energy_monthly:
  source: sensor.ev_solar_charging_energy
  cycle: monthly
ev_grid_energy_monthly:
  source: sensor.ev_grid_charging_energy
  cycle: monthly
# Reset when the car is plugged in (automation.ev_charge_session_reset)
ev_solar_energy_session:
  source: sensor.ev_solar_charging_energy
ev_grid_energy_session:
  source: sensor.ev_grid_charging_energy
