- binary_sensor:
    - name: EV Off Peak Charging Window
      unique_id: ev_off_peak_charging_window
      state: >
        {{ is_state('binary_sensor.octopus_energy_electricity_23e5077367_2000016805578_off_peak', 'on')
           or is_state('binary_sensor.octopus_energy_00000000_0002_4000_8020_0000000bb802_intelligent_dispatching', 'on') }}
      availability: >
        {{ has_value('binary_sensor.octopus_energy_electricity_23e5077367_2000016805578_off_peak')
           and has_value('binary_sensor.octopus_energy_00000000_0002_4000_8020_0000000bb802_intelligent_dispatching') }}

    # On when the pessimistic (p10) solar forecast for the rest of today will
    # still fill the house battery and cover the house until sunset. The car may
    # then take solar the battery would otherwise have stored. Switches off at
    # once, but only switches on after 15 minutes, to avoid flapping.
    - name: EV Car First
      unique_id: ev_car_first
      icon: mdi:car-arrow-left
      state: "{{ states('sensor.solar_spare_today_p10') | float(0) >= 1.5 }}"
      availability: "{{ has_value('sensor.solar_spare_today_p10') }}"
      delay_on: "00:15:00"

- sensor:
  # Solcast pessimistic (p10) generation for the rest of today. Solcast is set
  # to the array's 8.8 kW, but the inverter's AC output is limited to 6 kW:
  # generation above that (attribute above_6kw) can only charge the battery.
  - name: Solar Remaining Today P10
    unique_id: solar_remaining_today_p10
    device_class: energy
    unit_of_measurement: kWh
    state: >
      {% set ns = namespace(total=0) %}
      {% for period in state_attr('sensor.solcast_pv_forecast_forecast_today', 'detailedForecast') or [] %}
        {% set start = period.period_start if period.period_start is datetime else as_datetime(period.period_start) %}
        {% set end = start + timedelta(minutes=30) %}
        {% if end > now() %}
          {% set fraction = (end - [start, now()] | max).total_seconds() / 1800 %}
          {% set ns.total = ns.total + period.pv_estimate10 * 0.5 * fraction %}
        {% endif %}
      {% endfor %}
      {{ ns.total | round(2) }}
    attributes:
      above_6kw: >
        {% set ns = namespace(total=0) %}
        {% for period in state_attr('sensor.solcast_pv_forecast_forecast_today', 'detailedForecast') or [] %}
          {% set start = period.period_start if period.period_start is datetime else as_datetime(period.period_start) %}
          {% set end = start + timedelta(minutes=30) %}
          {% if end > now() %}
            {% set fraction = (end - [start, now()] | max).total_seconds() / 1800 %}
            {% set ns.total = ns.total + [period.pv_estimate10 - 6.0, 0] | max * 0.5 * fraction %}
          {% endif %}
        {% endfor %}
        {{ ns.total | round(2) }}
    availability: "{{ state_attr('sensor.solcast_pv_forecast_forecast_today', 'detailedForecast') is not none }}"

  # Pessimistic (p10) solar left today beyond filling the house battery
  # (allowing 5% loss) and the house until sunset (0.6 kW). Generation above
  # the inverter's 6 kW AC limit counts only towards filling the battery; any
  # more than that is lost. Used by car first (1.5 kWh) and by filling the
  # battery late (templates/battery_mode.yaml).
  - name: Solar Spare Today P10
    unique_id: solar_spare_today_p10
    device_class: energy
    unit_of_measurement: kWh
    icon: mdi:solar-power-variant
    state: >
      {% set capacity = states('sensor.solaredge_multi_i1_b1_available_energy') | float(8.7) %}
      {% set soc = states('sensor.solaredge_battery1_state_of_charge') | float(0) %}
      {% set gap = capacity * (100 - soc) / 100 / 0.95 %}
      {% set total = states('sensor.solar_remaining_today_p10') | float(0) %}
      {% set above = state_attr('sensor.solar_remaining_today_p10', 'above_6kw') | float(0) %}
      {% set usable = total - above + [above, gap] | min %}
      {# House load until today's sunset; before sunrise this includes the rest
         of the night. After sunset, next_setting is tomorrow's: none left. #}
      {% set sunset = as_datetime(state_attr('sun.sun', 'next_setting')) %}
      {% set hours = (sunset - now()).total_seconds() / 3600
           if sunset is not none and as_local(sunset).date() == now().date() else 0 %}
      {{ (usable - gap - hours * 0.6) | round(2) }}
    availability: >
      {{ has_value('sensor.solar_remaining_today_p10')
         and has_value('sensor.solaredge_battery1_state_of_charge') }}

  # Solar power the car could use. When the car comes first, this includes the
  # power currently charging the house battery.
  - name: EV Solar Headroom
    unique_id: ev_solar_headroom
    device_class: power
    state_class: measurement
    unit_of_measurement: W
    state: >
      {% set export = states('sensor.power_grid_export') | float(0) %}
      {% set import = states('sensor.power_grid_import') | float(0) %}
      {% set battery_discharge = states('sensor.power_battery_discharging') | float(0) %}
      {# Not while the battery takes only clipped solar: that can't reach the car. #}
      {% set battery_charge = states('sensor.power_battery_charging') | float(0)
           if is_state('binary_sensor.ev_car_first', 'on')
              and not is_state('sensor.battery_mode', 'Charge from Clipped Solar Power') else 0 %}
      {% set tesla_power = states('sensor.ev_home_charging_power') | float(0) %}
      {{ [export - import + tesla_power + battery_charge - battery_discharge - 250, 0] | max | round(0) }}
    availability: >
      {{ has_value('sensor.power_grid_export')
         and has_value('sensor.power_grid_import')
         and has_value('sensor.power_battery_discharging')
         and has_value('sensor.power_battery_charging')
         and has_value('sensor.ev_home_charging_power') }}

  - name: EV Available Solar Power
    unique_id: ev_available_solar_power
    device_class: power
    state_class: measurement
    unit_of_measurement: W
    state: >
      {{ states('sensor.ev_solar_headroom_10_minute_average') | float(0) | round(0) }}
    availability: "{{ has_value('sensor.ev_solar_headroom_10_minute_average') }}"
