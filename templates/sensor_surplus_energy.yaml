- binary_sensor:
    # Is there surplus solar for the immersion heater (about 3.2 kW)?
    # Off: switch on only when export alone would cover the heater.
    # On: keep it on until the house imports or the battery discharges, so the
    # heater never runs on grid or stored energy.
    # Either way, the battery must be full (or charging at its maximum rate),
    # so the heater never takes solar the battery needs.
    # The heater's thermostat cuts in quickly, so the switch state alone says
    # little; these rules use power flows instead.
    - name: "Surplus power"
      unique_id: surplus_power
      state: >
        {% set export = states('sensor.power_grid_export') | float(0) %}
        {% set import = states('sensor.grid_import_power_meter') | float(0) %}
        {% set discharge = states('sensor.power_battery_discharging') | float(0) %}
        {% set battery_full = states('sensor.solaredge_battery1_state_of_charge') | float(0) >= 97
             or states('sensor.power_battery_charging') | float(0) >= 4500 %}
        {% if is_state('switch.immersion_plus1m_switch_0', 'on') %}
          {{ battery_full and import < 200 and discharge < 200 }}
        {% else %}
          {{ battery_full and export >= 3400 and import < 200 and discharge < 200 }}
        {% endif %}
      availability: >
        {{ has_value('sensor.power_grid_export') and has_value('sensor.grid_import_power_meter')
           and has_value('sensor.power_battery_discharging')
           and has_value('sensor.solaredge_battery1_state_of_charge') }}
      delay_on: "00:02:00"
      delay_off: "00:00:30"
