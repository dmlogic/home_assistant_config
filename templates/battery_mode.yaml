# House battery mode, applied to the SolarEdge inverter as a Remote Control
# command by automations/battery_mode_controller.yaml. The inverter's default
# mode is Maximize Self Consumption, and every command expires back to it, so
# a failure here leaves the battery working normally.
#
# Modes, in priority order, and the inverter command each uses:
# - Grid top-up ("Charge from Solar Power and Grid"): off-peak only, up to the
#   23:00 plan's target (templates/battery_plan.yaml), at a gentle rate, when
#   tomorrow's forecast won't cover the morning and evening.
# - Hold ("Maximize Self Consumption" with a 0 W discharge limit): the battery
#   does not discharge; solar serves the house first and the surplus still
#   charges the battery. While the car charges from the grid, and overnight
#   when the plan says the battery would otherwise run down below its target.
# - Car lock (as Hold): while the car may be solar-charging and the battery has
#   no energy to spare.
# - Fill late ("Charge from Clipped Solar Power"): when the pessimistic
#   forecast says the rest of today will fill the battery anyway, stop charging
#   it for now: solar goes to the house, car, immersion or export, the battery
#   spends fewer hours full, and it keeps room for solar above the inverter's
#   6 kW AC limit, which it still takes in this mode.
# - Normal ("Maximize Self Consumption").

- binary_sensor:
    - name: House Battery Hold
      unique_id: house_battery_hold
      icon: mdi:battery-lock
      state: >
        {% set charger_state = states('sensor.tesla_model_3_charging') %}
        {% set at_home = is_state('device_tracker.tesla_model_3_location', 'home') %}
        {% set charging = charger_state == 'charging' %}
        {% set plugged_in = charger_state not in ['unknown', 'unavailable', 'disconnected'] %}
        {% set level = states('sensor.tesla_model_3_battery_level') | float(-1) %}
        {% set limit = states('number.tesla_model_3_charge_limit') | float(-1) %}
        {% set needs_charge = plugged_in and not (level >= 0 and limit >= 0 and level >= limit) %}
        {% set off_peak = is_state('binary_sensor.ev_off_peak_charging_window', 'on') %}
        {% set override = is_state('input_boolean.ev_charge_override', 'on') %}
        {% set smart_charge = is_state('switch.octopus_energy_00000000_0002_4000_8020_0000000bb802_intelligent_smart_charge', 'on') %}
        {# Car charging from the grid. Off-peak, hold as soon as the car is plugged
           in and not full, so the hold is in place before the car reports charging. #}
        {% set car = at_home and ((charging and (override or off_peak or smart_charge))
                                  or (needs_charge and off_peak)) %}
        {# Overnight plan: off-peak tariff only; ignore plans older than 12 hours. #}
        {% set plan_at = as_datetime(state_attr('sensor.battery_overnight_plan', 'planned_at')) %}
        {% set overnight = is_state('binary_sensor.octopus_energy_electricity_23e5077367_2000016805578_off_peak', 'on')
             and state_attr('sensor.battery_overnight_plan', 'hold') in [true, 'True', 'true']
             and plan_at is not none and (now() - plan_at).total_seconds() < 43200 %}
        {{ car or overnight }}

- sensor:
    - name: Battery Mode
      unique_id: battery_mode
      icon: mdi:home-battery
      state: >
        {% set soc = states('sensor.solaredge_battery1_state_of_charge') | float(-1) %}
        {% set previous = this.state | default('') %}

        {# Grid top-up: 23:30-05:30 off-peak, to a fresh plan's target. Start
           2 points below the target so a small shortfall doesn't start a charge. #}
        {% set clock = now().strftime('%H:%M') %}
        {% set plan_at = as_datetime(state_attr('sensor.battery_overnight_plan', 'planned_at')) %}
        {% set target = states('sensor.battery_overnight_plan') | float(0)
             if plan_at is not none and (now() - plan_at).total_seconds() < 43200 else 0 %}
        {% set grid_window = (clock >= '23:30' or clock < '05:30')
             and is_state('binary_sensor.octopus_energy_electricity_23e5077367_2000016805578_off_peak', 'on') %}
        {% set grid_charge = grid_window and soc >= 0
             and (soc < target - 2 or (previous == 'Grid top-up' and soc < target)) %}

        {# Fill late: the pessimistic (p10) forecast covers filling the battery,
           the house until sunset and a margin (sensor.solar_spare_today_p10):
           3 kWh to start, 1.5 kWh to continue (as binary_sensor.ev_car_first).
           Only in daylight and above 50%, so there is stored energy to fall
           back on. This mode doesn't discharge, so leave when the house imports
           and wait 10 minutes after any import. #}
        {% set capping = previous == 'Fill late' %}
        {% set last_import = as_datetime(states('sensor.last_grid_import')) %}
        {% set import_quiet = is_state('binary_sensor.grid_importing', 'off')
             and (last_import is none or (now() - last_import).total_seconds() > 600) %}
        {% set fill_late = is_state('sun.sun', 'above_horizon') and import_quiet
             and has_value('sensor.solar_spare_today_p10')
             and states('sensor.solar_spare_today_p10') | float(0) >= (1.5 if capping else 3)
             and soc >= (47 if capping else 50) %}

        {# Car lock: while the car may be solar-charging, the battery only smooths
           its supply when it has energy to spare: at least 90% (92% to unlock
           once locked), or the forecast says it will fill anyway
           (binary_sensor.ev_car_first). Otherwise it doesn't discharge, so a
           shortfall shows as grid import, which the car controller sees at
           once rather than through the Tesla's 10-minute-old data. #}
        {% set car_lock = is_state('binary_sensor.ev_may_be_charging', 'on')
             and is_state('binary_sensor.ev_off_peak_charging_window', 'off')
             and is_state('binary_sensor.ev_car_first', 'off')
             and soc < (92 if previous == 'Car lock' else 90) %}

        {%- if grid_charge -%}Grid top-up
        {%- elif is_state('binary_sensor.house_battery_hold', 'on') -%}Hold
        {%- elif car_lock -%}Car lock
        {%- elif fill_late -%}Fill late
        {%- else -%}Normal
        {%- endif -%}
      attributes:
        # Grid charge rate, used in Grid top-up: finish about
        # an hour before 05:30. 500-2500 W, gentle on the battery and leaves supply
        # headroom for the car. Rounded to 250 W so small changes don't rewrite the
        # inverter.
        grid_charge_rate: >
          {% set soc = states('sensor.solaredge_battery1_state_of_charge') | float(0) %}
          {% set capacity = states('sensor.solaredge_multi_i1_b1_available_energy') | float(8.7) %}
          {% set needed = capacity * ([states('sensor.battery_overnight_plan') | float(0) - soc, 0] | max) / 100 %}
          {% set finish = today_at('04:30') if now().hour < 12 else today_at('04:30') + timedelta(days=1) %}
          {% set hours = [(finish - now()).total_seconds() / 3600, 0.5] | max %}
          {{ ([[needed / hours * 1000 / 250, 2] | max, 10] | min | round(0) * 250) | int }}
