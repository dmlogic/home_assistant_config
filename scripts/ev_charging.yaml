ev_charge_reconcile:
  alias: Reconcile EV charging
  description: Apply the Tesla, Octopus, and SolarEdge charging rules.
  mode: restart
  fields:
    solar_update:
      description: Allow a solar-current adjustment during this run.
      default: false
  sequence:
    - variables:
        charger_state: "{{ states('sensor.tesla_model_3_charging') }}"
        at_home: "{{ is_state('device_tracker.tesla_model_3_location', 'home') }}"
        charging: "{{ charger_state == 'charging' }}"
        plugged_in: "{{ charger_state not in ['unknown', 'unavailable', 'disconnected'] }}"
        smart_charge: "{{ is_state('switch.octopus_energy_00000000_0002_4000_8020_0000000bb802_intelligent_smart_charge', 'on') }}"
        override: "{{ is_state('input_boolean.ev_charge_override', 'on') }}"
        scheduled: "{{ is_state('binary_sensor.scheduled_charging_pending', 'on') }}"
        off_peak: "{{ is_state('binary_sensor.ev_off_peak_charging_window', 'on') }}"
        # Charging from the grid: Force fast charge, off-peak, or Octopus in control.
        # Octopus is included so the hold applies before its dispatch sensor updates.
        grid_charging: "{{ at_home and charging and (override or off_peak or smart_charge) }}"
        # Overnight battery hold from the 23:00 plan (templates/battery_plan.yaml),
        # during the off-peak tariff window only. Ignore plans older than 12 hours.
        overnight_hold: >
          {% set plan_at = as_datetime(state_attr('sensor.battery_overnight_plan', 'planned_at')) %}
          {{ is_state('binary_sensor.octopus_energy_electricity_23e5077367_2000016805578_off_peak', 'on')
             and state_attr('sensor.battery_overnight_plan', 'hold') in [true, 'True', 'true']
             and plan_at is not none and (now() - plan_at).total_seconds() < 43200 }}
        battery_soc: "{{ states('sensor.solaredge_battery1_state_of_charge') | float(-1) }}"
        battery_reserve_floor: "{{ battery_soc | int(0) }}"
        current_amps: "{{ states('number.tesla_model_3_charge_current') | float(-1) }}"
        available_solar: "{{ states('sensor.ev_available_solar_power') | float(-1) }}"
        instantaneous_solar: "{{ states('sensor.ev_solar_headroom') | float(-1) }}"
        solar_power: >
          {% if available_solar >= 0 and instantaneous_solar >= 0 %}
            {{ [available_solar, instantaneous_solar] | min }}
          {% elif instantaneous_solar >= 0 %}
            {{ instantaneous_solar }}
          {% else %}
            {{ available_solar }}
          {% endif %}
        solar_amps: "{{ (solar_power / 230) | int(0) if solar_power >= 0 else -1 }}"
        backup_reserve: "{{ states('number.solaredge_multi_i1_backup_reserve') | float(-1) }}"
        battery_level: "{{ states('sensor.tesla_model_3_battery_level') | float(-1) }}"
        charge_limit: "{{ states('number.tesla_model_3_charge_limit') | float(-1) }}"
        target_reached: "{{ battery_level >= 0 and charge_limit >= 0 and battery_level >= charge_limit }}"
        tesla_available: >
          {{ has_value('sensor.tesla_model_3_charging')
             and has_value('number.tesla_model_3_charge_current') }}
        battery_available: >
          {{ has_value('sensor.solaredge_battery1_state_of_charge')
             and has_value('number.solaredge_multi_i1_backup_reserve') }}

    # The house battery never supports grid charging of the car, and is held
    # overnight when the plan says so. Hold the reserve at the battery's state
    # of charge when the hold starts; solar can still charge the battery.
    # The inverter lets the state of charge dip a little under the reserve, so
    # only lower the reserve after a real drop (e.g. a BMS recalibration), or
    # each dip ratchets it down and the battery drains a percent at a time.
    - choose:
        - conditions: "{{ battery_available and (grid_charging or overnight_hold) }}"
          sequence:
            - if: "{{ backup_reserve == 0 or backup_reserve > battery_soc + 2 }}"
              then:
                - service: number.set_value
                  target:
                    entity_id: number.solaredge_multi_i1_backup_reserve
                  data:
                    value: "{{ battery_reserve_floor }}"
        - conditions: "{{ battery_available and backup_reserve != 0 }}"
          sequence:
            - service: number.set_value
              target:
                entity_id: number.solaredge_multi_i1_backup_reserve
              data:
                value: 0

    - choose:
        - conditions: "{{ not at_home }}"
          sequence:
            - stop: Tesla is away from home; local battery cleanup only.

        - conditions: "{{ override and target_reached }}"
          sequence:
            - service: input_boolean.turn_off
              target:
                entity_id: input_boolean.ev_charge_override
            - service: switch.turn_off
              target:
                entity_id: switch.octopus_energy_00000000_0002_4000_8020_0000000bb802_intelligent_bump_charge
            - stop: Tesla charge target reached; override cleared.

        - conditions: "{{ override and tesla_available }}"
          sequence:
            - if: "{{ current_amps != 32 }}"
              then:
                - service: number.set_value
                  target:
                    entity_id: number.tesla_model_3_charge_current
                  data:
                    value: 32
            - choose:
                - conditions: "{{ smart_charge }}"
                  sequence:
                    - service: switch.turn_on
                      target:
                        entity_id: switch.octopus_energy_00000000_0002_4000_8020_0000000bb802_intelligent_bump_charge
              default:
                - service: switch.turn_on
                  target:
                    entity_id: switch.tesla_model_3_charge
            - stop: Charge override active.

        - conditions: "{{ not tesla_available }}"
          sequence:
            - stop: Tesla charging state or current control is unavailable.

        - conditions: "{{ target_reached or not plugged_in or scheduled }}"
          sequence:
            - stop: Tesla is unavailable for automatic charging.

        - conditions: "{{ grid_charging }}"
          sequence:
            - if: "{{ current_amps != 32 }}"
              then:
                - service: number.set_value
                  target:
                    entity_id: number.tesla_model_3_charge_current
                  data:
                    value: 32
            - stop: Grid charging configured.

        - conditions: "{{ smart_charge }}"
          sequence:
            - stop: Octopus Intelligent controls the charging start time.

        # Peak hours: solar only. The headroom excludes battery discharge, so the
        # car never runs down the house battery.
        - conditions: "{{ charging }}"
          sequence:
            - if: "{{ solar_update and solar_amps >= 0 }}"
              then:
                - choose:
                    - conditions: "{{ solar_amps < 5 }}"
                      sequence:
                        - service: switch.turn_off
                          target:
                            entity_id: switch.tesla_model_3_charge
                  default:
                    - variables:
                        target_amps: "{{ [solar_amps, 16] | min }}"
                    - if: "{{ current_amps != target_amps }}"
                      then:
                        - service: number.set_value
                          target:
                            entity_id: number.tesla_model_3_charge_current
                          data:
                            value: "{{ target_amps }}"
            - stop: Peak charging configured.

        - conditions: "{{ off_peak }}"
          sequence:
            - if: "{{ current_amps != 32 }}"
              then:
                - service: number.set_value
                  target:
                    entity_id: number.tesla_model_3_charge_current
                  data:
                    value: 32
            - service: switch.turn_on
              target:
                entity_id: switch.tesla_model_3_charge

        - conditions: "{{ solar_update and solar_amps >= 5 }}"
          sequence:
            - variables:
                target_amps: "{{ [solar_amps, 16] | min }}"
            - if: "{{ current_amps != target_amps }}"
              then:
                - service: number.set_value
                  target:
                    entity_id: number.tesla_model_3_charge_current
                  data:
                    value: "{{ target_amps }}"
            - service: switch.turn_on
              target:
                entity_id: switch.tesla_model_3_charge
