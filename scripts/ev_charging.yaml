ev_charge_reconcile:
  alias: Reconcile EV charging
  description: Apply the Tesla, Octopus, and SolarEdge charging rules.
  mode: restart
  fields:
    solar_update:
      description: Allow a low-battery solar-current adjustment during this run.
      default: false
  sequence:
    - variables:
        charger_state: "{{ states('sensor.tesla_model_3_charging') }}"
        charging: "{{ charger_state == 'charging' }}"
        plugged_in: "{{ charger_state not in ['unknown', 'unavailable', 'disconnected'] }}"
        smart_charge: "{{ is_state('switch.octopus_energy_00000000_0002_4000_8020_0000000bb802_intelligent_smart_charge', 'on') }}"
        override: "{{ is_state('input_boolean.ev_charge_override', 'on') }}"
        scheduled: "{{ is_state('binary_sensor.scheduled_charging_pending', 'on') }}"
        off_peak: "{{ is_state('binary_sensor.ev_off_peak_charging_window', 'on') }}"
        time_of_use: "{{ is_state('select.solaredge_multi_i1_storage_control_mode', 'Time of Use') }}"
        battery_soc: "{{ states('sensor.solaredge_battery1_state_of_charge') | float(-1) }}"
        current_amps: "{{ states('number.tesla_model_3_charge_current') | float(-1) }}"
        available_solar: "{{ states('sensor.ev_available_solar_power') | float(-1) }}"
        backup_reserve: "{{ states('number.solaredge_multi_i1_backup_reserve') | float(-1) }}"
        battery_level: "{{ states('sensor.tesla_model_3_battery_level') | float(-1) }}"
        charge_limit: "{{ states('number.tesla_model_3_charge_limit') | float(-1) }}"
        target_reached: "{{ battery_level >= 0 and charge_limit >= 0 and battery_level >= charge_limit }}"
        tesla_available: >
          {{ has_value('sensor.tesla_model_3_charging')
             and has_value('number.tesla_model_3_charge_current') }}
        battery_available: >
          {{ has_value('sensor.solaredge_battery1_state_of_charge')
             and has_value('select.solaredge_multi_i1_storage_control_mode')
             and has_value('number.solaredge_multi_i1_backup_reserve') }}

    - choose:
        - conditions: "{{ override and target_reached }}"
          sequence:
            - service: input_boolean.turn_off
              target:
                entity_id: input_boolean.ev_charge_override
            - service: switch.turn_off
              target:
                entity_id: switch.octopus_energy_00000000_0002_4000_8020_0000000bb802_intelligent_bump_charge
            - stop: Tesla charge target reached; override cleared.

        - conditions: "{{ override and tesla_available }}"
          sequence:
            - if: "{{ current_amps != 32 }}"
              then:
                - service: number.set_value
                  target:
                    entity_id: number.tesla_model_3_charge_current
                  data:
                    value: 32
            - choose:
                - conditions: "{{ smart_charge }}"
                  sequence:
                    - service: switch.turn_on
                      target:
                        entity_id: switch.octopus_energy_00000000_0002_4000_8020_0000000bb802_intelligent_bump_charge
              default:
                - service: switch.turn_on
                  target:
                    entity_id: switch.tesla_model_3_charge
            - stop: Charge override active.

        - conditions: "{{ not tesla_available }}"
          sequence:
            - stop: Tesla charging state or current control is unavailable.

        - conditions: "{{ target_reached or not plugged_in or scheduled }}"
          sequence:
            - if: "{{ battery_available and not time_of_use and backup_reserve != 0 }}"
              then:
                - service: number.set_value
                  target:
                    entity_id: number.solaredge_multi_i1_backup_reserve
                  data:
                    value: 0
            - stop: Tesla is unavailable for automatic charging.

        - conditions: "{{ smart_charge and not charging }}"
          sequence:
            - if: "{{ battery_available and not time_of_use and backup_reserve != 0 }}"
              then:
                - service: number.set_value
                  target:
                    entity_id: number.solaredge_multi_i1_backup_reserve
                  data:
                    value: 0
            - stop: Octopus Intelligent controls the charging start time.

        - conditions: "{{ charging and off_peak }}"
          sequence:
            - if: "{{ current_amps != 32 }}"
              then:
                - service: number.set_value
                  target:
                    entity_id: number.tesla_model_3_charge_current
                  data:
                    value: 32
            - if: "{{ battery_available and backup_reserve != 50 }}"
              then:
                - service: number.set_value
                  target:
                    entity_id: number.solaredge_multi_i1_backup_reserve
                  data:
                    value: 50
            - stop: Off-peak charging configured.

        - conditions: "{{ charging and battery_available }}"
          sequence:
            - if: "{{ not time_of_use and backup_reserve != 0 }}"
              then:
                - service: number.set_value
                  target:
                    entity_id: number.solaredge_multi_i1_backup_reserve
                  data:
                    value: 0
            - choose:
                - conditions: "{{ battery_soc > 50 }}"
                  sequence:
                    - if: "{{ current_amps != 16 }}"
                      then:
                        - service: number.set_value
                          target:
                            entity_id: number.tesla_model_3_charge_current
                          data:
                            value: 16
                - conditions: "{{ solar_update and available_solar >= 0 }}"
                  sequence:
                    - variables:
                        solar_amps: "{{ (available_solar / 230) | int(0) }}"
                    - choose:
                        - conditions: "{{ solar_amps < 5 }}"
                          sequence:
                            - service: switch.turn_off
                              target:
                                entity_id: switch.tesla_model_3_charge
                      default:
                        - variables:
                            target_amps: "{{ [solar_amps, 16] | min }}"
                        - if: "{{ current_amps != target_amps }}"
                          then:
                            - service: number.set_value
                              target:
                                entity_id: number.tesla_model_3_charge_current
                              data:
                                value: "{{ target_amps }}"
            - stop: Peak charging configured.

        - conditions: "{{ off_peak }}"
          sequence:
            - if: "{{ current_amps != 32 }}"
              then:
                - service: number.set_value
                  target:
                    entity_id: number.tesla_model_3_charge_current
                  data:
                    value: 32
            - service: switch.turn_on
              target:
                entity_id: switch.tesla_model_3_charge

        - conditions: "{{ battery_available and battery_soc > 50 }}"
          sequence:
            - if: "{{ current_amps != 16 }}"
              then:
                - service: number.set_value
                  target:
                    entity_id: number.tesla_model_3_charge_current
                  data:
                    value: 16
            - service: switch.turn_on
              target:
                entity_id: switch.tesla_model_3_charge

        - conditions: "{{ battery_available and solar_update and available_solar >= 0 }}"
          sequence:
            - variables:
                solar_amps: "{{ (available_solar / 230) | int(0) }}"
            - choose:
                - conditions: "{{ solar_amps >= 5 }}"
                  sequence:
                    - variables:
                        target_amps: "{{ [solar_amps, 16] | min }}"
                    - if: "{{ current_amps != target_amps }}"
                      then:
                        - service: number.set_value
                          target:
                            entity_id: number.tesla_model_3_charge_current
                          data:
                            value: "{{ target_amps }}"
                    - service: switch.turn_on
                      target:
                        entity_id: switch.tesla_model_3_charge
